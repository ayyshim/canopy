<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16794F">
<title>Canopy is offline</title>
<style>
:root{color-scheme:light dark;--paper:#F6F7F9;--ink:#14181F;--muted:#4A5462;--green:#16794F;--green-ink:#fff}
@media(prefers-color-scheme:dark){:root{--paper:#101419;--ink:#E6EBF0;--muted:#A3AEBB;--green:#3FA877;--green-ink:#06140D}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;text-align:center}
main{padding:24px}
h1{font-size:22px;margin:16px 0 6px}
p{margin:0 0 20px;color:var(--muted)}
button{min-height:42px;padding:0 20px;border:0;border-radius:11px;background:var(--green);color:var(--green-ink);font:600 15px system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32" aria-hidden="true">
<rect width="32" height="32" rx="7" fill="#16794F"/>
<path d="M16 11v5M7 16h18M7 16v4M16 16v4M25 16v4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<rect x="11" y="4.5" width="10" height="7" rx="2" fill="#fff"/>
<rect x="3.5" y="19" width="7.5" height="7.5" rx="2" fill="#FFE58A"/>
<rect x="12.25" y="19" width="7.5" height="7.5" rx="2" fill="#BFE6D1"/>
<rect x="21" y="19" width="7.5" height="7.5" rx="2" fill="#D9D0FA"/>
</svg>
<h1>Canopy is offline</h1>
<p>Check your connection, then try again.</p>
<button type="button" onclick="location.reload()">Retry</button>
</main>
</body>
</html>

openapi: 3.1.0
info:
  title: Canopy API
  version: 0.1.0
  description: >
    REST API served by the hub under /api/v1. Unsafe requests need the X-CSRF-Token header to
    echo the canopy_csrf cookie (GET /auth/csrf issues one). Objects outside the caller's
    organizations are reported as 404.
servers:
  - url: /api/v1
paths:
  /clis:
    get:
      summary: List the CLIs Canopy can drive and the catalog of staff "good at" skills
      responses:
        "200":
          description: CLIs, base roles and the categorized skill catalog
          content: { application/json: { schema: { type: object, required: [clis, skills, catalog], properties: { clis: { type: array, items: { type: object } }, skills: { type: array, description: The base roles, items: { type: string, enum: [developer, reviewer, researcher, designer, writer] } }, catalog: { type: array, items: { $ref: "#/components/schemas/SkillCategory" } } } } } }
  /auth/csrf:
    get:
      summary: Issue or return the CSRF token
      responses:
        "200": { description: Token, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
  /auth/signup:
    post:
      summary: Create an organization, then its owner, and sign in
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignupRequest" } } } }
      responses:
        "201": { description: Signed in with a session that still needs its two-factor code, content: { application/json: { schema: { $ref: "#/components/schemas/SignInResult" } } } }
        "403": { description: signups_closed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "email_taken, or setup_required before hub setup", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      summary: Sign in with email and password
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { description: Signed in with a session that still needs its two-factor code, content: { application/json: { schema: { $ref: "#/components/schemas/SignInResult" } } } }
        "401": { description: "unknown_email, wrong_password or no_password", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: End the current session, or every session of the person with everywhere
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { everywhere: { type: boolean } } } } } }
      responses:
        "204": { description: Signed out }
  /auth/forgot:
    post:
      summary: Email a password reset link (always 202)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses:
        "202": { description: Accepted }
        "422": { $ref: "#/components/responses/Error" }
  /auth/reset/{token}:
    get:
      summary: Check a reset link
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Valid, content: { application/json: { schema: { type: object, properties: { valid: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /auth/reset:
    post:
      summary: Set a new password from a reset link; revokes all sessions and signs in
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } } }
      responses:
        "200": { description: Signed in with a session that still needs its two-factor code, content: { application/json: { schema: { $ref: "#/components/schemas/SignInResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/oauth/{provider}/start:
    get:
      summary: Redirect to the provider
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [github, google] } }]
      responses:
        "302": { description: Redirect }
  /me:
    get:
      summary: The signed-in user and their organizations
      responses:
        "200": { description: Me, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update profile, switch organization, change password
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatchMeRequest" } } } }
      responses:
        "200": { description: Me, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /orgs:
    post:
      summary: Create another organization owned by the caller
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrgInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/OrgResponse" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /orgs/{orgId}:
    parameters: [{ name: orgId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: An organization the caller belongs to
      responses:
        "200": { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/OrgResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Rename or change limits (owners and admins)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatchOrgRequest" } } } }
      responses:
        "200": { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/OrgResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete the organization and everything in it (owner; confirm is its name)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string } } } } } }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /orgs/{orgId}/transfer:
    parameters: [{ name: orgId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Make another member the owner; the caller becomes an admin (owner)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: { type: string, format: uuid } } } } } }
      responses:
        "204": { description: Transferred }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /orgs/{orgId}/usage/claude:
    parameters: [{ name: orgId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Claude Code's own limit reports for the caller's computers
      responses:
        "200": { description: One entry per computer the caller owns, content: { application/json: { schema: { $ref: "#/components/schemas/ClaudeUsageResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /hub:
    get:
      summary: Public hub info; setup_required until first-run setup
      responses:
        "200": { description: Hub, content: { application/json: { schema: { $ref: "#/components/schemas/Hub" } } } }
  /hub/setup:
    post:
      summary: First-run setup — name the hub, store sign-in providers, create the first hub admin
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HubSetupRequest" } } } }
      responses:
        "201": { description: Signed in as hub admin with a session that still needs its two-factor code, content: { application/json: { schema: { $ref: "#/components/schemas/SignInResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/overview:
    get:
      summary: Hub totals and recent hub events (hub admins)
      responses:
        "200": { description: Overview, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverview" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/organizations:
    get:
      summary: Every organization on the hub (hub admins)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: Page, content: { application/json: { schema: { type: object, required: [items, total], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminOrg" } }, total: { type: integer } } } } } }
  /admin/organizations/{orgId}:
    get:
      summary: One organization with its members (hub admins)
      parameters: [{ name: orgId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      summary: Every user on the hub (hub admins)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: Page, content: { application/json: { schema: { type: object, required: [items, total], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }, total: { type: integer } } } } } }
  /admin/users/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: One user with their organizations (hub admins)
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserDetail" } } } }
    patch:
      summary: Grant or remove hub admin; the last hub admin can't be removed
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [is_hub_admin], properties: { is_hub_admin: { type: boolean } } } } } }
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserDetail" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /auth/two-factor:
    get:
      summary: What a session still has to do (open to a session that is waiting for its two-factor code)
      responses:
        "200": { description: "next is enroll, verify, or an empty string once the session is verified", content: { application/json: { schema: { $ref: "#/components/schemas/TwoFactorState" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/two-factor/setup:
    post:
      summary: Make a new secret for someone who is not enrolled yet. The secret is only ever returned here
      responses:
        "200": { description: Secret, otpauth URL and QR code, content: { application/json: { schema: { $ref: "#/components/schemas/TwoFactorSetup" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: already_enrolled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /auth/two-factor/enable:
    post:
      summary: Turn two-factor on with the first code, verify the session and return the recovery codes (shown once)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, description: "The 6-digit code from the authenticator app" } } } } } }
      responses:
        "200": { description: Recovery codes and the signed-in user, content: { application/json: { schema: { type: object, required: [recovery_codes, me], properties: { recovery_codes: { type: array, items: { type: string } }, me: { $ref: "#/components/schemas/Me" } } } } } }
        "401": { description: "too_many_attempts after 5 wrong codes ends the session", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "already_enrolled or setup_required", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { description: invalid_code, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /auth/two-factor/verify:
    post:
      summary: Verify the session with an authenticator code or a single-use recovery code
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string }, recovery_code: { type: string } } } } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { description: "too_many_attempts after 5 wrong codes ends the session", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: not_enrolled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { description: invalid_code, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /invites/{token}/accept:
    post:
      summary: Accept an invitation (new people choose a name and password) and sign in
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, password: { type: string } } } } } }
      responses:
        "200": { description: Signed in with a session that still needs its two-factor code, content: { application/json: { schema: { $ref: "#/components/schemas/SignInResult" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /me/two-factor/recovery-codes:
    post:
      summary: Make 10 new recovery codes; the old ones stop working
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, description: "The 6-digit code from the authenticator app" } } } } } }
      responses:
        "200": { description: The new codes (shown once), content: { application/json: { schema: { type: object, required: [recovery_codes], properties: { recovery_codes: { type: array, items: { type: string } } } } } } }
        "422": { description: invalid_code, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /me/two-factor/change:
    post:
      summary: Clear the authenticator and recovery codes, end the other sessions and send this one back to enroll
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, description: "The 6-digit code from the authenticator app" } } } } } }
      responses:
        "200": { description: Set up a new app now, content: { application/json: { schema: { $ref: "#/components/schemas/TwoFactorState" } } } }
        "422": { description: invalid_code, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /admin/users/{userId}/two-factor/reset:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Clear a person's authenticator and recovery codes and end all their sessions (hub admins; everyone else gets 404). They are emailed
      responses:
        "204": { description: Reset }
        "404": { $ref: "#/components/responses/Error" }
  /admin/settings:
    get:
      summary: Hub settings; client secrets are never returned
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/HubSettings" } } } }
    patch:
      summary: Rename the hub, open or close sign-ups, configure sign-in providers
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatchHubSettings" } } } }
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/HubSettings" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{wsId}/skills:
    get:
      summary: List the workspace skill library, and which skills each member has
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Skills, content: { application/json: { schema: { $ref: "#/components/schemas/SkillList" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a skill to the library (admins). GitHub links are fetched and stored.
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SkillInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SkillResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: skill_name_taken, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{wsId}/staff-proposals:
    get:
      summary: List managers' drafts of new staff and instruction updates (workspace admins only)
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }, { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected] } }]
      responses:
        "200": { description: Drafts, newest first, content: { application/json: { schema: { type: object, required: [proposals], properties: { proposals: { type: array, items: { $ref: "#/components/schemas/StaffProposal" } } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /workspaces/{wsId}/staff-proposals/{proposalId}/approve:
    post:
      summary: Approve a draft (admins only); fields sent replace the draft's
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }, { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffProposalEdit" } } } }
      responses:
        "200": { description: Approved, content: { application/json: { schema: { type: object, required: [proposal, member], properties: { proposal: { $ref: "#/components/schemas/StaffProposal" }, member: { type: object, description: "The new or updated member (MemberView in core-types)" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: proposal_decided, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{wsId}/staff-proposals/{proposalId}/reject:
    post:
      summary: Reject a draft (workspace admins only)
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }, { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { type: object, required: [proposal], properties: { proposal: { $ref: "#/components/schemas/StaffProposal" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: proposal_decided, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /orgs/{orgId}/setup/chat:
    post:
      summary: Ask Claude on the admin's own computer to suggest a team for the setup wizard (admins only). Nothing is stored.
      parameters: [{ name: orgId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [runner_id, messages], properties: { runner_id: { type: string, format: uuid }, workspace: { type: object }, directories: { type: array, items: { type: object } }, skills: { type: array, items: { type: object } }, messages: { type: array, items: { type: object, required: [role, text], properties: { role: { type: string, enum: [user, assistant] }, text: { type: string } } } } } } } } }
      responses:
        "200": { description: A reply and an optional team draft, content: { application/json: { schema: { type: object, required: [reply], properties: { reply: { type: string }, team: { type: [object, "null"] } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: runner_offline, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /orgs/{orgId}/skills/preview:
    post:
      summary: Fetch a GitHub markdown link for the setup wizard without saving it (org admins)
      parameters: [{ name: orgId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [source_url], properties: { source_url: { type: string } } } } } }
      responses:
        "200": { description: The markdown and a suggested name, content: { application/json: { schema: { type: object, required: [name, content], properties: { name: { type: string }, content: { type: string } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /skills/{skillId}:
    patch:
      summary: Edit a skill (admins). Send refresh to fetch a GitHub skill again.
      parameters: [{ name: skillId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SkillInput" } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/SkillResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: skill_name_taken, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a skill; members lose it (admins)
      parameters: [{ name: skillId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /workspaces/{wsId}/members/{memberId}/skills:
    get:
      summary: Skills attached to a member
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }, { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Skills, content: { application/json: { schema: { type: object, required: [skills], properties: { skills: { type: array, items: { $ref: "#/components/schemas/Skill" } } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /workspaces/{wsId}/members/{memberId}/skills/{skillId}:
    put:
      summary: Attach a library skill to a member (admins; managers use the assign_skill tool)
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }, { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }, { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The member's skills, content: { application/json: { schema: { type: object, required: [skills], properties: { skills: { type: array, items: { $ref: "#/components/schemas/Skill" } } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Detach a skill from a member (admins)
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }, { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }, { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The member's skills, content: { application/json: { schema: { type: object, required: [skills], properties: { skills: { type: array, items: { $ref: "#/components/schemas/Skill" } } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /workspaces/{wsId}/jobs:
    get:
      summary: List the jobs the caller can see (those of managers they can see), with each job's last run
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { type: object, required: [jobs], properties: { jobs: { type: array, items: { $ref: "#/components/schemas/Job" } } } } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a job. The schedule is cron or plain text; a continuous job gets its memory note.
      parameters: [{ name: wsId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/JobInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/JobResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}:
    get:
      summary: One job (404 when the caller can't see its manager)
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Job, content: { application/json: { schema: { $ref: "#/components/schemas/JobResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Edit a job (its owner or a workspace admin). Only admins change the owner.
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/JobInput" } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/JobResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a job and its memory (owner or admin). Refused with run_in_progress while a run is going.
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: run_in_progress, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /jobs/{jobId}/pause:
    post:
      summary: Pause a job (owner or admin). A run that is going keeps going.
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Paused, content: { application/json: { schema: { $ref: "#/components/schemas/JobResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: job_ended, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /jobs/{jobId}/resume:
    post:
      summary: Resume a paused job from now; nothing missed while paused is replayed
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Resumed, content: { application/json: { schema: { $ref: "#/components/schemas/JobResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: not_paused or job_ended, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /jobs/{jobId}/run:
    post:
      summary: Start a run now, outside the schedule. With test true it never writes memory. Neither moves the next run.
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { test: { type: boolean } } } } } }
      responses:
        "202": { description: Started, content: { application/json: { schema: { type: object, required: [run], properties: { run: { $ref: "#/components/schemas/JobRun" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: run_in_progress, job_ended or no_worker, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /jobs/{jobId}/runs:
    get:
      summary: A job's runs, newest first, including skipped ones with their reason
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }, { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }]
      responses:
        "200": { description: Runs, content: { application/json: { schema: { type: object, required: [runs], properties: { runs: { type: array, items: { $ref: "#/components/schemas/JobRun" } } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{jobId}/memory:
    get:
      summary: The rolling summary of a continuous job (404 for a single run job)
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Memory, content: { application/json: { schema: { $ref: "#/components/schemas/JobMemory" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace the summary (owner or admin). Refused with run_in_progress while a run is going.
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [memory], properties: { memory: { type: string, maxLength: 5000 } } } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/JobMemory" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: run_in_progress, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /schedules/preview:
    post:
      summary: Turn a cron expression or plain text such as "every weekday at 9" into a cron, a sentence and the next 5 run times
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [schedule], properties: { schedule: { type: string }, timezone: { type: string, description: IANA zone; default is the workspace organization's, else UTC }, workspace_id: { type: string, format: uuid } } } } } }
      responses:
        "200": { description: Preview, content: { application/json: { schema: { $ref: "#/components/schemas/SchedulePreview" } } } }
        "422": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "e.g. validation, two_factor_required, invalid_code, email_taken, unknown_email, wrong_password, invalid_token, rate_limited, csrf, not_found" }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string }, description: "Inline message per field path, e.g. user.email" }
            next: { type: string, enum: [enroll, verify], description: "With 401 two_factor_required: what the session must do" }
    ClaudeWindow:
      type: object
      required: [key, used_percent]
      properties:
        key: { type: string, description: "five_hour, seven_day, ..." }
        used_percent: { type: number, description: "0 to 100" }
        resets_at: { type: string, format: date-time }
        status: { type: string, description: "e.g. allowed, allowed_warning, rejected" }
    ClaudeComputerUsage:
      type: object
      required: [runner_id, name, online, sign_in, reported, windows]
      properties:
        runner_id: { type: string, format: uuid }
        name: { type: string }
        online: { type: boolean }
        sign_in: { type: string, description: "subscription, api_key, or empty when Claude Code isn't set up" }
        reported: { type: boolean, description: "false until Claude Code reports its limits; show 'no data yet', not 0%" }
        reported_at: { type: string, format: date-time }
        windows: { type: array, items: { $ref: "#/components/schemas/ClaudeWindow" } }
    ClaudeUsageResponse:
      type: object
      required: [computers]
      properties:
        computers: { type: array, items: { $ref: "#/components/schemas/ClaudeComputerUsage" } }
    Providers:
      type: object
      required: [github, google]
      properties: { github: { type: boolean }, google: { type: boolean } }
    Hub:
      type: object
      required: [name, setup_required, signup_open, providers]
      properties:
        name: { type: string }
        setup_required: { type: boolean }
        signup_open: { type: boolean, description: Anyone may register an organization }
        providers: { $ref: "#/components/schemas/Providers" }
    ProviderInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        client_id: { type: string }
        client_secret: { type: string, description: Empty keeps the stored secret }
    HubSetupRequest:
      type: object
      required: [token, hub, admin]
      properties:
        token: { type: string, description: Setup code printed in the hub's log on first start }
        hub: { type: object, required: [name], properties: { name: { type: string }, signup_open: { type: boolean } } }
        admin: { type: object, required: [name, email, password], properties: { name: { type: string }, email: { type: string }, password: { type: string } } }
        providers: { type: object, properties: { github: { $ref: "#/components/schemas/ProviderInput" }, google: { $ref: "#/components/schemas/ProviderInput" } } }
    ProviderSettings:
      type: object
      required: [enabled, client_id, has_secret, callback_url]
      properties:
        enabled: { type: boolean }
        client_id: { type: string }
        has_secret: { type: boolean }
        callback_url: { type: string }
    HubSettings:
      type: object
      required: [name, signup_open, providers]
      properties:
        name: { type: string }
        signup_open: { type: boolean }
        providers: { type: object, required: [github, google], properties: { github: { $ref: "#/components/schemas/ProviderSettings" }, google: { $ref: "#/components/schemas/ProviderSettings" } } }
    PatchHubSettings:
      type: object
      properties:
        name: { type: string }
        signup_open: { type: boolean }
        providers: { type: object, properties: { github: { $ref: "#/components/schemas/ProviderInput" }, google: { $ref: "#/components/schemas/ProviderInput" } } }
    PersonRef:
      type: object
      required: [id, name, email]
      properties: { id: { type: string, format: uuid }, name: { type: string }, email: { type: string } }
    AdminOverview:
      type: object
      required: [hub, totals, recent_events]
      properties:
        hub: { type: object, required: [name, signup_open, set_up_at], properties: { name: { type: string }, signup_open: { type: boolean }, set_up_at: { type: string, format: date-time } } }
        totals:
          type: object
          required: [organizations, users, hub_admins, active_users_24h, users_7d, organizations_7d]
          properties:
            organizations: { type: integer }
            users: { type: integer }
            hub_admins: { type: integer }
            active_users_24h: { type: integer }
            users_7d: { type: integer }
            organizations_7d: { type: integer }
        recent_events: { type: array, items: { type: object, required: [type, summary, at], properties: { type: { type: string }, summary: { type: string }, at: { type: string, format: date-time } } } }
    AdminOrg:
      type: object
      required: [id, name, slug, size, members, created_at, owner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        size: { $ref: "#/components/schemas/OrgSize" }
        members: { type: integer }
        created_at: { type: string, format: date-time }
        owner: { $ref: "#/components/schemas/PersonRef" }
    AdminOrgDetail:
      type: object
      required: [organization, members]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        members: { type: array, items: { type: object, required: [id, name, email, role, status, joined_at], properties: { id: { type: string, format: uuid }, name: { type: string }, email: { type: string }, role: { $ref: "#/components/schemas/OrgRole" }, status: { type: string }, joined_at: { type: string, format: date-time } } } }
    AdminUser:
      type: object
      required: [id, name, email, is_hub_admin, organizations, created_at, last_active_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        is_hub_admin: { type: boolean }
        organizations: { type: integer }
        created_at: { type: string, format: date-time }
        last_active_at: { type: [string, "null"], format: date-time }
    AdminUserDetail:
      type: object
      required: [user, organizations]
      properties:
        user: { type: object, required: [id, name, email, is_hub_admin, created_at], properties: { id: { type: string, format: uuid }, name: { type: string }, email: { type: string }, is_hub_admin: { type: boolean }, created_at: { type: string, format: date-time } } }
        organizations: { type: array, items: { type: object, required: [id, name, role], properties: { id: { type: string, format: uuid }, name: { type: string }, role: { $ref: "#/components/schemas/OrgRole" } } } }
    OrgSize:
      type: string
      enum: [just_me, "2_10", "11_50", "51_plus"]
    OrgRole:
      type: string
      enum: [owner, admin, member]
    OrgInput:
      type: object
      required: [name, size]
      properties:
        name: { type: string }
        size: { $ref: "#/components/schemas/OrgSize" }
        about: { type: string, description: What agents will work on }
    SignupRequest:
      type: object
      required: [org, user]
      properties:
        org: { $ref: "#/components/schemas/OrgInput" }
        user:
          type: object
          required: [name, email, password, accept_terms]
          properties:
            name: { type: string }
            email: { type: string }
            password: { type: string, minLength: 8 }
            accept_terms: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string }, password: { type: string } }
    User:
      type: object
      required: [id, email, name, avatar_color, has_password, is_hub_admin, providers, notifications]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        avatar_color: { type: string }
        has_password: { type: boolean }
        is_hub_admin: { type: boolean }
        providers: { type: array, items: { type: string } }
        notifications: { $ref: "#/components/schemas/NotificationPrefs" }
        snooze_until: { type: [string, "null"], format: date-time, description: "Push is paused until then; null when not paused" }
    NotificationPref:
      type: object
      required: [desktop, email, push]
      properties: { desktop: { type: boolean }, email: { type: boolean }, push: { type: boolean } }
    NotificationPrefs:
      type: object
      description: Keys are questions, progress, errors, goal_ready and daily.
      additionalProperties: { $ref: "#/components/schemas/NotificationPref" }
    OrgSummary:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        logo_url: { type: [string, "null"] }
    DraftSkill:
      type: object
      required: [name, content, source_url]
      properties:
        name: { type: string, maxLength: 80 }
        content: { type: string }
        source_url: { type: string, description: "Where the skill was found; empty when written by the manager" }
    StaffProposal:
      type: object
      required: [id, kind, manager_id, member_id, name, role, instructions, skills, status, reason, note, result_member_id, decided_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [new, update] }
        manager_id: { type: string, format: uuid }
        member_id: { type: [string, "null"], format: uuid, description: "The staff member an update changes" }
        name: { type: string }
        role: { type: [string, "null"], enum: [developer, reviewer, researcher, designer, writer, null] }
        instructions: { type: string }
        skills: { type: array, items: { $ref: "#/components/schemas/DraftSkill" } }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        note: { type: string }
        result_member_id: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    StaffProposalEdit:
      type: object
      description: Edits an admin makes while approving; omitted fields keep the draft's values.
      properties:
        name: { type: string }
        role: { type: string, enum: [developer, reviewer, researcher, designer, writer] }
        instructions: { type: string }
        skills: { type: array, items: { $ref: "#/components/schemas/DraftSkill" } }
    SkillCategory:
      type: object
      required: [key, label, subs]
      properties:
        key: { type: string, example: marketing }
        label: { type: string, example: Marketing }
        subs:
          type: array
          items:
            type: object
            required: [key, label, desc, base]
            properties:
              key: { type: string, example: marketing.seo }
              label: { type: string }
              desc: { type: string }
              base: { type: string, enum: [developer, reviewer, researcher, designer, writer], description: Drives default folder access and planning }
    Skill:
      type: object
      required: [id, name, source_kind, source_url, content, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source_kind: { type: string, enum: [md, github] }
        source_url: { type: string, description: "The GitHub link; empty for markdown skills" }
        content: { type: string }
        updated_at: { type: string, format: date-time }
    SkillInput:
      type: object
      description: "Create needs name and source_kind, plus content (md) or source_url (github). Edits send only what changes."
      properties:
        name: { type: string, maxLength: 80 }
        source_kind: { type: string, enum: [md, github] }
        source_url: { type: string }
        content: { type: string }
        refresh: { type: boolean }
    SkillResponse:
      type: object
      required: [skill]
      properties: { skill: { $ref: "#/components/schemas/Skill" } }
    SkillList:
      type: object
      required: [skills, member_skills]
      properties:
        skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }
        member_skills:
          type: object
          description: Member id to the ids of the library skills attached to them
          additionalProperties: { type: array, items: { type: string, format: uuid } }
    SignInResult:
      type: object
      required: [two_factor]
      description: Every sign-in starts a session that can't use the API until its code is checked
      properties:
        two_factor: { type: string, enum: [enroll, verify], description: "enroll: set up an authenticator first (POST /auth/two-factor/setup then /enable). verify: enter a code (POST /auth/two-factor/verify)" }
    TwoFactorState:
      type: object
      required: [next]
      properties:
        next: { type: string, enum: [enroll, verify, ""] }
    TwoFactorSetup:
      type: object
      required: [secret, otpauth_url, qr_png]
      properties:
        secret: { type: string, description: Base32, for typing into an app }
        otpauth_url: { type: string }
        qr_png: { type: string, description: "data:image/png;base64,… QR code of otpauth_url" }
    TwoFactorStatus:
      type: object
      required: [enabled_at, recovery_codes_left]
      properties:
        enabled_at: { type: [string, "null"], format: date-time }
        recovery_codes_left: { type: integer }
    Me:
      type: object
      required: [user, organizations, current_org_id, waiting, two_factor]
      properties:
        waiting: { type: integer, description: "Open things that need this person, for the app badge" }
        two_factor: { $ref: "#/components/schemas/TwoFactorStatus" }
        user: { $ref: "#/components/schemas/User" }
        organizations: { type: array, items: { $ref: "#/components/schemas/OrgSummary" } }
        current_org_id: { type: [string, "null"], format: uuid, description: "Null: the user has no organization and should create one" }
    PatchMeRequest:
      type: object
      properties:
        name: { type: string }
        avatar_color: { type: string }
        last_org_id: { type: string, format: uuid }
        current_password: { type: string }
        new_password: { type: string }
        notifications: { $ref: "#/components/schemas/NotificationPrefs" }
        snooze_until: { type: [string, "null"], format: date-time, description: "A time pauses push; null resumes it; leave it out to keep it" }
    Organization:
      type: object
      required: [id, name, slug, size, about, default_session_limit, default_weekly_limit, timezone, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        size: { $ref: "#/components/schemas/OrgSize" }
        about: { type: string }
        default_session_limit: { type: integer, format: int64 }
        default_weekly_limit: { type: integer, format: int64 }
        timezone: { type: string }
        logo_url: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    OrgResponse:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { $ref: "#/components/schemas/OrgRole" }
    PatchOrgRequest:
      type: object
      properties:
        name: { type: string }
        default_session_limit: { type: integer, format: int64 }
        default_weekly_limit: { type: integer, format: int64 }
        timezone: { type: string }
    Job:
      type: object
      required: [id, workspace_id, title, kind, status, pause_reason, brief, cron, timezone, schedule, missed_policy, catchup_window_secs, run_timeout_secs, notify, required_dirs, consecutive_failures]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string, enum: [single, continuous] }
        status: { type: string, enum: [active, paused, ended] }
        pause_reason: { type: string, enum: ["", owner, failures, cap, owner_left] }
        brief: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
        manager_id: { type: string, format: uuid, nullable: true }
        assignee_member_id: { type: string, format: uuid, nullable: true, description: Null means the manager does the work }
        runner_id: { type: string, format: uuid, nullable: true, description: Null means the owner's own computer }
        cron: { type: string }
        timezone: { type: string }
        schedule: { type: string, description: The schedule in words; empty if it can't be described }
        next_run_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        missed_policy: { type: string, enum: [skip, run_once] }
        catchup_window_secs: { type: integer }
        run_timeout_secs: { type: integer }
        token_cap_per_run: { type: integer, format: int64, nullable: true }
        token_cap_per_month: { type: integer, format: int64, nullable: true }
        notify: { type: string, enum: [attention, always, failures] }
        ends_at: { type: string, format: date-time, nullable: true }
        max_runs: { type: integer, nullable: true }
        required_dirs: { type: array, items: { type: object, required: [directory_id, mode], properties: { directory_id: { type: string, format: uuid }, mode: { type: string, enum: [read, read_write] } } } }
        memory_note_id: { type: string, format: uuid, nullable: true }
        consecutive_failures: { type: integer }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_run: { $ref: "#/components/schemas/JobRun" }
    JobResponse:
      type: object
      required: [job]
      properties: { job: { $ref: "#/components/schemas/Job" } }
    JobInput:
      type: object
      description: Create needs title, kind, brief, manager_id and schedule. Patch takes any of the rest; kind can't change.
      properties:
        title: { type: string, maxLength: 200 }
        kind: { type: string, enum: [single, continuous] }
        brief: { type: string, maxLength: 20000 }
        manager_id: { type: string, format: uuid }
        assignee_member_id: { type: string, format: uuid, nullable: true, description: "The manager or one of their staff; null = the manager" }
        runner_id: { type: string, format: uuid, nullable: true, description: "Your own computer or a shared one; null = your own" }
        owner_user_id: { type: string, format: uuid, description: Admins only, on patch }
        schedule: { type: string, description: A 5-field cron expression or plain text such as "every weekday at 9" }
        timezone: { type: string, description: IANA zone; default is the organization's }
        missed_policy: { type: string, enum: [skip, run_once] }
        catchup_window_secs: { type: integer }
        run_timeout_secs: { type: integer, minimum: 60 }
        token_caps: { type: object, properties: { per_run: { type: integer, format: int64, nullable: true }, per_month: { type: integer, format: int64, nullable: true } } }
        notify: { type: string, enum: [attention, always, failures] }
        ends: { type: object, properties: { at: { type: string, format: date-time, nullable: true }, max_runs: { type: integer, nullable: true } } }
        required_dirs: { type: array, description: The member doing the work must already have these grants, items: { type: object, required: [directory_id, mode], properties: { directory_id: { type: string, format: uuid }, mode: { type: string, enum: [read, read_write] } } } }
    JobRun:
      type: object
      required: [id, job_id, number, scheduled_for, trigger, status, skip_reason, attempt, tokens, result, title, summary, error]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        number: { type: integer }
        scheduled_for: { type: string, format: date-time }
        trigger: { type: string, enum: [schedule, manual, test] }
        status: { type: string, enum: [running, succeeded, failed, skipped, capped, cancelled] }
        skip_reason: { type: string }
        attempt: { type: integer }
        goal_id: { type: string, format: uuid, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        tokens: { type: integer, format: int64 }
        result: { type: string, enum: ["", ok, attention, nothing_to_do] }
        title: { type: string }
        summary: { type: string }
        error: { type: string }
    JobMemory:
      type: object
      required: [memory, note_id, number, updated_at, max_chars]
      properties:
        memory: { type: string }
        note_id: { type: string, format: uuid }
        number: { type: integer, description: The note's N- number }
        updated_at: { type: string, format: date-time }
        max_chars: { type: integer }
    SchedulePreview:
      type: object
      required: [cron, sentence, zone, next]
      properties:
        cron: { type: string }
        sentence: { type: string }
        zone: { type: string }
        next: { type: array, description: The next 5 run times in UTC, items: { type: string, format: date-time } }
